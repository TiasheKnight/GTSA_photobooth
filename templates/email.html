<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Send Your Photostrip</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

<div class="container py-5" style="min-height:100vh;">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-7">
            <h2 class="mb-2">Send your photostrip</h2>
            <p class="text-white mb-4">Enter your email and we’ll send the strip as a PNG attachment.</p>

            <div id="missingStrip" class="alert alert-warning d-none">
                We couldn’t find your photostrip in this browser session. Please go back and capture again.
                <div class="mt-2">
                    <a class="btn btn-outline-dark" href="/template_select">Back to booth</a>
                </div>
            </div>

            <div class="card bg-dark border-secondary mb-4">
                <div class="card-header border-secondary">Preview</div>
                <div class="card-body text-center">
                    <img id="previewImg" class="img-fluid rounded border" alt="Photostrip preview" style="max-width:420px;">
                    <div class="mt-3">
                        <a id="dl" class="btn btn-outline-light" href="#">Download PNG</a>
                    </div>
                </div>
            </div>

            <form id="sendForm" method="POST" action="/email">
                <label class="form-label" for="email">Email</label>
                <input id="email" type="email" name="email" class="form-control form-control-lg mb-3" placeholder="you@example.com" required>
                <input type="hidden" name="photostrip_data" id="photostrip_data">

                <button type="submit" class="btn btn-success btn-lg w-100">Send my photostrip</button>
            </form>

            <div class="mt-3">
                <a href="/" class="btn btn-link text-light">Cancel & return home</a>
            </div>
        </div>
    </div>
</div>

<script>
  const data = sessionStorage.getItem('last_photostrip');
  const input = document.getElementById('photostrip_data');
  const preview = document.getElementById('previewImg');
  const dl = document.getElementById('dl');
  const missing = document.getElementById('missingStrip');
  const form = document.getElementById('sendForm');

  if (!data) {
    missing.classList.remove('d-none');
    form.classList.add('d-none');
    preview.classList.add('d-none');
    dl.classList.add('d-none');
  } else {
    input.value = data;
    preview.src = data;
    dl.href = data;
    dl.download = 'photostrip.png';
  }
</script>

</body>
</html>
