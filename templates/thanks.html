<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Thanks!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background-color: #111; }
        .countdown { font-weight: bold; }
    </style>

    <script>
        let seconds = 10;
        function autoRedirect() {
            const timer = document.getElementById("timer");
            const interval = setInterval(() => {
                seconds--;
                timer.textContent = seconds;
                if (seconds <= 0) {
                    clearInterval(interval);
                    window.location.href = "/";
                }
            }, 1000);
        }
        window.onload = autoRedirect;
    </script>
</head>

<body class="text-light d-flex justify-content-center align-items-center" style="height:100vh;">

<div class="text-center">
    <h1 class="mb-3">Thank you!</h1>
    <p class="lead">Your photostrip is on its way to your inbox 📬</p>
    <p class="text-muted">Returning to home in <span id="timer" class="countdown">10</span> seconds...</p>

    <a href="/" class="btn btn-outline-light btn-lg mt-4">Return Now</a>
</div>

</body>
</html>
