<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Email Photostrip</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

<div class="container d-flex flex-column justify-content-center align-items-center" style="height:100vh;">
    <h2 class="mb-3">Where should we send it?</h2>
    <form method="POST" action="/send_email" class="w-50">
        <input type="email" name="email" class="form-control form-control-lg mb-3" placeholder="you@example.com" required>
        <button type="submit" class="btn btn-primary btn-lg w-100">Send My Photostrip</button>
    </form>
    <a href="/" class="btn btn-link mt-3 text-light">Cancel and Return Home</a>
</div>

</body>
</html>
