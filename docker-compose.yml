version: '3.8'

services:
  web:
    build: .
    container_name: gtsa-photobooth-dev
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - FLASK_APP=app.py
      - FLASK_DEBUG=True
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    command: flask run --host 0.0.0.0
    networks:
      - photobooth-network

networks:
  photobooth-network:
    driver: bridge
