<svg width="320" height="440" viewBox="0 0 320 440" xmlns="http://www.w3.org/2000/svg">
  <!-- Booth frame -->
  <rect x="10" y="10" width="300" height="420" rx="10" fill="#2c2c2c" stroke="#111" stroke-width="4"/>

  <!-- Curtains (left & right) -->
  <!-- <rect id="curtain-left" x="10" y="10" width="140" height="420" fill="#b30000"/>
  <rect id="curtain-right" x="170" y="10" width="140" height="420" fill="#b30000"/> -->

  <!-- Curtain highlights -->
  <line x1="50" y1="10" x2="50" y2="430" stroke="#ff6666" stroke-width="3" opacity="0.4"/>
  <line x1="270" y1="10" x2="270" y2="430" stroke="#ff6666" stroke-width="3" opacity="0.4"/>

  <!-- Coin Slot Panel -->
  <rect x="220" y="50" width="70" height="120" fill="#444" stroke="#000" stroke-width="3" rx="6"/>
  <rect id="coin-slot" x="240" y="90" width="30" height="6" rx="2" fill="#111"/>
  
  <!-- $0 Sign -->
  <rect x="220" y="180" width="70" height="40" fill="#eee" stroke="#000" stroke-width="2" rx="6"/>
  <text x="255" y="207" font-size="20" text-anchor="middle" font-weight="bold" fill="#000">$0</text>
  <text x="255" y="222" font-size="10" text-anchor="middle" font-weight="bold" fill="#000">PER PHOTO</text>

  <!-- Decorative sign text -->
  <text x="160" y="60" text-anchor="middle" font-size="22" fill="#fff" font-weight="bold">PHOTO</text>
  <text x="160" y="90" text-anchor="middle" font-size="22" fill="#fff" font-weight="bold">BOOTH</text>
</svg>
