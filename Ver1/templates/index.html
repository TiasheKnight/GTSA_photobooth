{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="booth-wrapper">
        <div class="photobooth">
            <!-- Sign at top -->
            <div class="booth-sign">
                <h1>PHOTOBOOTH</h1>
            </div>

            <!-- Main booth body -->
            <div class="booth-body">
                <!-- Featured strips section -->
                <div class="featured-section">
                    <a href="#" class="featured-frame">
                        <div class="strip-placeholder" style="background: linear-gradient(135deg, #d4a5a5 0%, #c49393 100%); transform: rotate(2deg);"></div>
                        <div class="strip-placeholder" style="background: linear-gradient(135deg, #a5b4d4 0%, #8fa3c4 100%); transform: rotate(-1deg);"></div>
                        <div class="strip-placeholder" style="background: linear-gradient(135deg, #d4c5a5 0%, #c4b593 100%); transform: rotate(3deg);"></div>
                        <div class="strip-placeholder" style="background: linear-gradient(135deg, #a5d4b4 0%, #93c4a3 100%); transform: rotate(-2deg);"></div>
                    </a>
                    <div class="featured-label">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="display: inline-block; vertical-align: middle; margin-right: 2px;">
                            <path d="M4 12c4-4 8-4 12 0" stroke="#1b1919" stroke-width="2" fill="none"/>
                            <path d="M16 8l0 4l4 0" stroke="#1b1919" stroke-width="2" fill="none"/>
                        </svg>
                        featured<br>strips
                    </div>
                </div>

                <!-- Coin slot -->
                <div class="coin-slot">
                    <div class="coin-slot-inner">
                        <div class="coin-slot-hole"></div>
                        <div class="coin-slot-face">:)</div>
                    </div>
                </div>

                <!-- Curtain section -->
                <div class="curtain-section">
                    <div class="curtain">
                        <svg viewBox="0 0 100 200" class="curtain-svg" preserveAspectRatio="none">
                            <path class="curtain-lines" d="M20,0 Q25,50 20,100 Q15,150 20,200"/>
                            <path class="curtain-lines" d="M35,0 Q40,50 35,100 Q30,150 35,200"/>
                            <path class="curtain-lines" d="M50,0 Q55,50 50,100 Q45,150 50,200"/>
                            <path class="curtain-lines" d="M65,0 Q70,50 65,100 Q60,150 65,200"/>
                            <path class="curtain-lines" d="M80,0 Q85,50 80,100 Q75,150 80,200"/>
                        </svg>
                    </div>

                    <!-- Stool -->
                    <div class="stool">
                        <div class="stool-seat"></div>
                        <div class="stool-stem"></div>
                        <div class="stool-base"></div>
                    </div>
                </div>

                <!-- Window on right -->
                <div class="booth-window">
                    <div class="window-line"></div>
                    <div class="window-line"></div>
                    <div class="window-line"></div>
                </div>
            </div>

            <!-- Enter button -->
            <a href="{{ url_for('booth') }}" class="enter-btn">
                enter
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M5 12h14m-6-6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>

            <!-- Attribution -->
            <div class="attribution">
                <span>made by</span>
                <a href="https://www.instagram.com/visarchivess" target="_blank" rel="noopener noreferrer">@visarchivess</a>
                <div class="social-icons">
                    <a href="https://www.tiktok.com/@visarchivess" target="_blank" rel="noopener noreferrer" title="TikTok">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-5.2 1.74 2.89 2.89 0 012.31-4.64 2.93 2.93 0 01.88.13V9.4a6.84 6.84 0 00-1-.05A6.33 6.33 0 005 20.1a6.34 6.34 0 0010.86-4.43v-7a8.16 8.16 0 004.77 1.52v-3.4a4.85 4.85 0 01-1-.1z"/>
                        </svg>
                    </a>
                    <a href="https://www.instagram.com/visarchivess" target="_blank" rel="noopener noreferrer" title="Instagram">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="2" width="20" height="20" rx="5"/>
                            <circle cx="12" cy="12" r="4"/>
                            <circle cx="18" cy="6" r="1.5" fill="currentColor"/>
                        </svg>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
