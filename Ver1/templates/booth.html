{% extends 'base.html' %}

{% block title %}Photobooth | MySketchBooth{% endblock %}

{% block content %}
<style>
    .countdown-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 8rem;
        font-weight: bold;
        color: white;
        z-index: 10;
    }

    .flash {
        animation: flash 0.3s ease-out;
    }

    @keyframes flash {
        0% { filter: brightness(3); }
        100% { filter: brightness(1); }
    }

    .photo-strip-container {
        margin-top: 2rem;
        display: none;
        flex-direction: column;
        align-items: center;
    }

    .photo-strip {
        background: white;
        padding: 15px;
        border: 3px solid #1b1919;
        display: flex;
        flex-direction: column;
        gap: 10px;
        box-shadow: 4px 4px 0 rgba(0,0,0,0.1);
    }

    .photo-strip img {
        width: 280px;
        height: auto;
        aspect-ratio: 4/3;
        object-fit: cover;
        border: 2px solid #1b1919;
    }

    .strip-footer {
        text-align: center;
        font-family: 'Caveat', cursive;
        font-size: 1.2rem;
        color: #1b1919;
        margin-top: 5px;
        padding-top: 5px;
        border-top: 1px dashed #ccc;
    }

    .progress-indicator {
        display: flex;
        gap: 0.5rem;
        margin-top: 1rem;
    }

    .progress-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #ddd;
        border: 2px solid #1b1919;
    }

    .progress-dot.captured {
        background: #1b1919;
    }

    .progress-dot.current {
        animation: pulse 1s infinite;
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.3); }
    }

    .status-text {
        margin-top: 1rem;
        font-size: 1.1rem;
        color: #1b1919;
        font-weight: 500;
    }
</style>

<div class="booth-page">
    <div class="page-header" style="width: 100%; max-width: 640px;">
        <a href="{{ url_for('home') }}" class="back-btn">&larr; Back</a>
        <h1 class="page-title">Photobooth</h1>
    </div>

    <div class="booth-screen" id="booth-screen" style="position: relative;">
        <div id="camera-placeholder">
            <p>Click "Start Camera" to begin</p>
        </div>
        <video id="video" autoplay playsinline style="display: none; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);"></video>
        <div id="countdown-overlay" class="countdown-overlay" style="display: none;"></div>
    </div>

    <div class="progress-indicator" id="progress-indicator" style="display: none;">
        <div class="progress-dot" id="dot1"></div>
        <div class="progress-dot" id="dot2"></div>
        <div class="progress-dot" id="dot3"></div>
    </div>

    <div class="status-text" id="status-text"></div>

    <div class="booth-controls">
        <button class="booth-btn" id="start-btn" onclick="startCamera()">Start Camera</button>
        <button class="booth-btn primary" id="capture-btn" onclick="startPhotoSequence()" style="display: none;">Take Photos</button>
        <button class="booth-btn" id="retake-btn" onclick="retakePhotos()" style="display: none;">Retake</button>
        <button class="booth-btn primary" id="download-btn" onclick="downloadStrip()" style="display: none;">Download Strip</button>
    </div>

    <div class="photo-strip-container" id="strip-container">
        <div class="photo-strip" id="photo-strip">
            <img id="photo1" alt="Photo 1">
            <img id="photo2" alt="Photo 2">
            <img id="photo3" alt="Photo 3">
            <div class="strip-footer">MySketchBooth</div>
        </div>
    </div>

    <canvas id="canvas" style="display: none;"></canvas>
    <canvas id="strip-canvas" style="display: none;"></canvas>
</div>

<script>
let stream = null;
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const stripCanvas = document.getElementById('strip-canvas');
const placeholder = document.getElementById('camera-placeholder');
const startBtn = document.getElementById('start-btn');
const captureBtn = document.getElementById('capture-btn');
const retakeBtn = document.getElementById('retake-btn');
const downloadBtn = document.getElementById('download-btn');
const stripContainer = document.getElementById('strip-container');
const countdownOverlay = document.getElementById('countdown-overlay');
const progressIndicator = document.getElementById('progress-indicator');
const statusText = document.getElementById('status-text');

let capturedPhotos = [];

async function startCamera() {
    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
        });
        video.srcObject = stream;
        video.style.display = 'block';
        placeholder.style.display = 'none';
        startBtn.style.display = 'none';
        captureBtn.style.display = 'inline-block';
        statusText.textContent = 'Ready! Click "Take Photos" to capture 3 photos.';
    } catch (err) {
        alert('Could not access camera. Please ensure you have granted camera permissions.');
        console.error('Camera error:', err);
    }
}

async function startPhotoSequence() {
    capturedPhotos = [];
    captureBtn.style.display = 'none';
    retakeBtn.style.display = 'none';
    downloadBtn.style.display = 'none';
    stripContainer.style.display = 'none';
    progressIndicator.style.display = 'flex';

    // Reset progress dots
    document.getElementById('dot1').className = 'progress-dot';
    document.getElementById('dot2').className = 'progress-dot';
    document.getElementById('dot3').className = 'progress-dot';

    for (let i = 0; i < 3; i++) {
        const dotId = `dot${i + 1}`;
        document.getElementById(dotId).classList.add('current');

        // Countdown 3 seconds before each photo
        await countdown(3, i + 1);

        // Capture photo
        capturePhoto(i);

        document.getElementById(dotId).classList.remove('current');
        document.getElementById(dotId).classList.add('captured');

        // Flash effect
        video.classList.add('flash');
        setTimeout(() => video.classList.remove('flash'), 300);

        // Wait before next photo (except for last one)
        if (i < 2) {
            statusText.textContent = `Photo ${i + 1} captured! Get ready for the next one...`;
            await sleep(1000);
        }
    }

    statusText.textContent = 'All photos captured! Creating your strip...';
    await sleep(500);

    // Create and display the strip
    createPhotoStrip();

    progressIndicator.style.display = 'none';
    retakeBtn.style.display = 'inline-block';
    downloadBtn.style.display = 'inline-block';
    statusText.textContent = 'Your photo strip is ready!';
}

async function countdown(seconds, photoNum) {
    for (let i = seconds; i > 0; i--) {
        countdownOverlay.style.display = 'flex';
        countdownOverlay.textContent = i;
        statusText.textContent = `Photo ${photoNum} of 3 in ${i}...`;
        await sleep(1000);
    }
    countdownOverlay.style.display = 'none';
}

function capturePhoto(index) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');

    // Flip horizontally for mirror effect
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0);

    // Apply vintage filter
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;

    for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];

        // Warm vintage tone
        data[i] = Math.min(255, r * 1.1 + 15);
        data[i + 1] = Math.min(255, g * 0.95 + 8);
        data[i + 2] = Math.min(255, b * 0.85);
    }

    ctx.putImageData(imageData, 0, 0);

    const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
    capturedPhotos[index] = dataUrl;
    document.getElementById(`photo${index + 1}`).src = dataUrl;
}

function createPhotoStrip() {
    stripContainer.style.display = 'flex';

    // Create the full strip canvas for download
    const photoWidth = 400;
    const photoHeight = 300;
    const padding = 20;
    const gap = 15;
    const footerHeight = 50;

    stripCanvas.width = photoWidth + (padding * 2);
    stripCanvas.height = (photoHeight * 3) + (gap * 2) + (padding * 2) + footerHeight;

    const ctx = stripCanvas.getContext('2d');

    // White background
    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, stripCanvas.width, stripCanvas.height);

    // Border
    ctx.strokeStyle = '#1b1919';
    ctx.lineWidth = 4;
    ctx.strokeRect(2, 2, stripCanvas.width - 4, stripCanvas.height - 4);

    // Load and draw each photo
    let loadedCount = 0;
    capturedPhotos.forEach((photoUrl, index) => {
        const img = new Image();
        img.onload = () => {
            const y = padding + (index * (photoHeight + gap));

            // Photo border
            ctx.strokeStyle = '#1b1919';
            ctx.lineWidth = 2;
            ctx.strokeRect(padding - 2, y - 2, photoWidth + 4, photoHeight + 4);

            // Draw photo
            ctx.drawImage(img, padding, y, photoWidth, photoHeight);

            loadedCount++;
            if (loadedCount === 3) {
                // Add footer text
                ctx.font = '24px Caveat, cursive, sans-serif';
                ctx.fillStyle = '#1b1919';
                ctx.textAlign = 'center';
                const footerY = padding + (3 * photoHeight) + (2 * gap) + 35;
                ctx.fillText('MySketchBooth', stripCanvas.width / 2, footerY);

                // Add date
                ctx.font = '14px sans-serif';
                ctx.fillStyle = '#666';
                const date = new Date().toLocaleDateString();
                ctx.fillText(date, stripCanvas.width / 2, footerY + 20);
            }
        };
        img.src = photoUrl;
    });
}

function downloadStrip() {
    const link = document.createElement('a');
    link.download = 'photobooth-strip-' + Date.now() + '.jpg';
    link.href = stripCanvas.toDataURL('image/jpeg', 0.95);
    link.click();
}

function retakePhotos() {
    capturedPhotos = [];
    stripContainer.style.display = 'none';
    retakeBtn.style.display = 'none';
    downloadBtn.style.display = 'none';
    captureBtn.style.display = 'inline-block';
    statusText.textContent = 'Ready! Click "Take Photos" to capture 3 photos.';

    // Reset progress dots
    document.getElementById('dot1').className = 'progress-dot';
    document.getElementById('dot2').className = 'progress-dot';
    document.getElementById('dot3').className = 'progress-dot';
}

function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

// Cleanup on page unload
window.addEventListener('beforeunload', () => {
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
    }
});
</script>
{% endblock %}
